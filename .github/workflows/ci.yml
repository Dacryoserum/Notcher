name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Tests
        run: ./Scripts/test.sh
      - name: Release build
        run: ./Scripts/build.sh release
