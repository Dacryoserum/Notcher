name: Idea
description: Something Notcher could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like, and the moment in your day when it would help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround you use now, if any.
